<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
    <input id="inputBox" name="values" class="values" readonly>
    <div class="rows">
    <div class="key">C/CE</div>
    <div class="key">OFF</div>
    <div class="key">|</div>
    <div class="key">%</div>
    
    <div class="key">MRC</div>
    <div class="key">M-</div>
    <div class="key">M+</div>
    <div class="key">/</div>

    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key">*</div>

    <div class = "key">4</div>
    <div class = "key">5</div>
    <div class = "key">6</div>
    <div class = "key">-</div>
    
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key plus-sign">+</div>
    
    <div class="key">0</div>
    <div class="key">.</div>
    <div class="key">=</div>
    <!--<div>=</div>-->
    </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
