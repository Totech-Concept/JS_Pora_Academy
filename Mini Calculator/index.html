<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
    <input type="number" name="values" class="values">
    <div class="rows">
    <div>C/CE</div>
    <div>OFF</div>
    <div>|</div>
    <div>%</div>
    </div>
    
    <div class="rows">
    <div>MRC</div>
    <div>M-</div>
    <div>M+</div>
    <div>➗</div>
    </div>

    <div class="rows">
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>✖️</div>
    </div>

    <div class="rows">
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>➖</div>
    </div>

    <div class="rows">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div class="plus-sign">➕</div>
    </div>

    <div class="rows">
    <div>0</div>
    <div>.</div>
    <div>=</div>
    <!--<div>=</div>-->
    </div>
    </main>
</body>
</html>
